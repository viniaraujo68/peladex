services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - edge_data:/data
      - edge_config:/config
    networks:
      - web

networks:
  web:
    external: true

volumes:
  edge_data:
  edge_config:

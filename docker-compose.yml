services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PELADEX_DATABASE_URL: sqlite:////data/peladex.db
      PELADEX_COOKIE_SECURE: "true"
      PELADEX_CORS_ORIGINS: ""
      PELADEX_SESSION_TTL_DAYS: "30"
      PELADEX_ALLOW_REGISTRATION: "${PELADEX_ALLOW_REGISTRATION:-true}"
    volumes:
      - peladex_data:/data
    networks:
      web:
        aliases:
          - peladex-backend

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      PORT: "3000"
      ORIGIN: https://${PELADEX_DOMAIN:-peladex.rastrovin.org}
      PELADEX_API_INTERNAL_URL: http://backend:8000
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: "1"
    depends_on:
      - backend
    networks:
      web:
        aliases:
          - peladex-frontend

networks:
  web:
    external: true

volumes:
  peladex_data:
